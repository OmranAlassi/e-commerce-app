name: online_store
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.9.1
  get_storage: ^2.1.1
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.1
  flutter_launcher_icons: ^0.14.4
  flutter_spinkit: ^5.2.2
  pinput: ^6.0.2
  persistent_bottom_nav_bar_v2: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/images/shopping-cart-svgrepo-com.png"
  image_path_ios: "assets/images/shopping-cart-svgrepo-com.png"
